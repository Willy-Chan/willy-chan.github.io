---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p><small>{{ page.date | date: "%B %d, %Y" }}</small></p>
  {{ content }}

  {% if page.pdf %}
  <section class="post-pdf">
    <div class="post-pdf-header">
      <h2>PDF</h2>
      <a href="{{ page.pdf | relative_url }}" target="_blank" rel="noopener">Open in new tab</a>
    </div>
    <iframe
      class="post-pdf-frame"
      src="{{ page.pdf | relative_url }}"
      title="{{ page.title }} PDF"
    ></iframe>
  </section>
  {% endif %}
</article>
